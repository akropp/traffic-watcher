version: '3.8'

services:
  car-counter:
    build: .
    container_name: car-counter
    restart: unless-stopped
    
    environment:
      # Set to 'false' if you want to enable GUI mode (requires X11 forwarding)
      - HEADLESS=true
      
      # GStreamer pipeline with VA-API hardware decoding
      # OpenCV 4.10+ has proper GStreamer appsink support
      # rtspsrc: RTSP source with TCP transport
      # rtph264depay: Depacketize RTP H.264
      # h264parse: Parse H.264 stream
      # vah264dec: Modern VA-API H.264 decoder (headless-compatible)
      # videoconvert: Convert to format OpenCV can read
      # appsink: Output for OpenCV VideoCapture
      - VIDEO_SOURCE=rtspsrc location=rtsp://frigate.thekropp.com:8554/driveway protocols=tcp ! rtph264depay ! h264parse ! vah264dec ! videoconvert ! appsink
      
      # Video downsampling (0.5 = half resolution, 1.0 = original)
      # Use 0.5 for faster CPU processing, 1.0 for better accuracy
      - VIDEO_SCALE=0.5
      
      # GStreamer VAAPI device
      - GST_VAAPI_DRM_DEVICE=/dev/dri/renderD128
      
      # Force VAAPI to use DRM backend (headless mode, no X11/Wayland)
      - LIBVA_DRIVER_NAME=iHD
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
      
      # Database path
      - DB_PATH=/app/data/traffic_watcher.db
    
    volumes:
      # Persist logs and snapshots on host
      - ./logs:/app/logs
      - ./snapshots:/app/snapshots
      
      # Shared database in local data directory
      - ./data:/app/data
      
      # Optional: Mount config file if you want to modify settings without rebuilding
      # - ./main.py:/app/main.py:ro
    
    # Hardware acceleration for GStreamer VAAPI
    devices:
      - /dev/dri:/dev/dri
    
    # Limit CPU usage if running on shared hardware
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    # Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    container_name: traffic-watcher-web
    restart: unless-stopped
    command: python3 web_app.py
    
    environment:
      - WEB_PORT=5050
      - DB_PATH=/app/data/traffic_watcher.db
    
    ports:
      - "5050:5050"
    
    volumes:
      # Share snapshots with web service
      - ./snapshots:/app/snapshots:ro
      - ./static:/app/static:ro
      
      # Shared database in local data directory
      - ./data:/app/data
    
    depends_on:
      - car-counter
    
    # Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
